<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aktieriem | Impromotion</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20261010">
</head>
<body class="app-page">
  <header class="nav nav--solid" id="nav">
    <a class="nav__logo" href="/" aria-label="Impromotion, uz sākumu">
      <img src="/assets/img/logo-white.webp" alt="Impromotion" width="500" height="250">
    </a>
    <button class="nav__toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Izvēlne">
      <span></span><span></span>
    </button>
    <nav class="nav__links" id="nav-links">
      <a href="/#pakalpojumi">Pakalpojumi</a>
      <a href="/#lomas">Slēptās lomas</a>
      <a href="/#aktieri">Aktieri</a>
      <a href="/blogs/">Blogs</a>
      <a href="/pievienojies/">Pievienojies</a>
      <a class="nav__login" href="/aktieriem/" aria-current="page">Aktieriem</a>
      <span class="app-nav" id="app-nav" hidden><a href="/admin/" id="admin-link" hidden>Admins</a><button class="btn btn--ghost btn--sm" type="button" id="logout">Iziet</button></span>
      <a class="btn btn--sm btn--yellow" href="/#kontakti">Sazināties</a>
    </nav>
  </header>

  <main class="app">
    <div id="view" class="app__wrap"><p class="muted">Ielādē…</p></div>
  </main>

  <script type="module">
    import { sb, $, esc, greet, mountLogin, currentProfile } from '/assets/backend/sb.js';
    import { renderActorForm } from '/assets/backend/actor-form.js';
    import { mountCalendar } from '/assets/backend/calendar.js';
    import { renderTroupeForm } from '/assets/backend/troupe-form.js';

    const view = $('#view');

    async function show() {
      const profile = await currentProfile();
      if (!profile) { $('#app-nav').hidden = true; await mountLogin(view, { redirectPath: '/aktieriem/' }); return; }
      $('#app-nav').hidden = false;
      $('#admin-link').hidden = profile.role !== 'admin';

      const { data: actor } = await sb.from('actors').select('*').eq('user_id', profile.id).maybeSingle();
      if (!actor) {
        view.innerHTML = profile.role === 'admin'
          ? `<div class="panel"><h1 class="h2">Sveiks, admin!</h1><p>Aktieru profili, ielūgumi un pieejamība ir <a href="/admin/">admina lapā</a>.</p></div>`
          : `<div class="panel"><h1 class="h2">Profils vēl nav piesaistīts</h1><p>Jūsu e-pasts (${esc(profile.email)}) nav saistīts ar aktiera profilu. Rakstiet uz hello@impromotion.lv.</p></div>`;
        return;
      }

      view.innerHTML = `
        <div class="app__intro">
          <p class="eyebrow eyebrow--yellow">Aktiera profils</p>
          <h1 class="h2">${esc(greet(actor.full_name))}</h1>
          <p class="muted">Šeit aizpildiet, ko protat, un atzīmējiet dienas, kad nevarat strādāt. Mājaslapā rādām tikai to, kam piekrītat. Tālrunis un honorārs paliek redzami tikai Impromotion.</p>
          <p class="small muted">Lai vēlāk atgrieztos, atveriet impromotion.lv, izvēlnē spiediet “Aktieriem” un ierakstiet savu e-pastu. Atnāks jauna saite ienākšanai.</p>
        </div>
        <div class="app__cols">
          <section class="panel" id="profile"></section>
          <aside class="app__side">
            <section class="panel"><h2 class="panel__title">Manas haltūras</h2><ul class="plain-list gigs" id="gigs"><li class="muted">Ielādē…</li></ul></section>
            <section class="panel"><h2 class="panel__title">Aizņemtās dienas</h2><div id="calendar"></div></section>
          </aside>
        </div>`;
      renderActorForm($('#profile'), actor, { onSaved: show });
      const { data: gigs } = await sb.rpc('my_bookings');
      const STATUS_B = { tentative: 'provizoriski', confirmed: 'apstiprināta', done: 'notikusi' };
      $('#gigs').innerHTML = (gigs || []).length
        ? gigs.map((g) => `<li><div><strong>${esc(g.day.split('-').reverse().join('.'))} · ${esc(g.title)}</strong><span class="muted small"> ${STATUS_B[g.status] || ''}${g.actor_fee_eur != null ? ` · honorārs ${g.actor_fee_eur} €` : ''}</span>${g.location ? `<br><span class="small">${esc(g.location)}</span>` : ''}${g.details ? `<p class="small gig__details">${esc(g.details)}</p>` : ''}</div></li>`).join('')
        : '<li class="muted">Pagaidām nav. Kad Impromotion jums ierezervēs pasākumu, tas parādīsies šeit.</li>';
      mountCalendar($('#calendar'), actor.id, { booked: (gigs || []).map((g) => g.day) });

      // Collective admins also edit their collective's profile here.
      const { data: troupeId } = await sb.rpc('my_troupe_id');
      if (troupeId) {
        const [{ data: troupe }, { data: members }] = await Promise.all([
          sb.from('troupes').select('*').eq('id', troupeId).single(),
          sb.rpc('my_troupe_members'),
        ]);
        if (troupe) {
          const panel = document.createElement('section');
          panel.className = 'panel';
          panel.id = 'kolektivs';
          panel.innerHTML = `<p class="eyebrow eyebrow--yellow">Mans kolektīvs</p><h2 class="h2">${esc(troupe.name)}</h2><p class="muted">Jūs esat šī kolektīva admins. Šeit aizpildiet kolektīva profilu, ko rādīsim impromotion.lv.</p><div id="troupe-form"></div>`;
          view.querySelector('.app__intro').after(panel);
          renderTroupeForm($('#troupe-form'), troupe, { members: members || [], onSaved: show });
          if (location.hash === '#kolektivs') panel.scrollIntoView();
        }
      }
    }

    let booted = false;
    $('#logout').addEventListener('click', async () => { await sb.auth.signOut(); show(); });
    // The magic link lands here signed in; avoid rendering twice on the initial SIGNED_IN event.
    sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN' && booted && view.querySelector('.login')) show(); });
    show().then(() => { booted = true; });
  </script>
  <script src="/assets/blog.js" defer></script>
</body>
</html>
