name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SiteGround tells browsers to keep CSS, JS and images for a year, so every deploy
      # gives our own assets a fresh ?v= and changed files reach returning visitors.
      - name: Stamp asset versions
        run: |
          find . -name '*.html' -not -path './_source/*' -print0 | xargs -0 \
            sed -i -E "s#((https://impromotion\.lv)?/?(assets/[^\"?]+|styles\.css|main\.js|favicon\.ico))(\?v=[^\"]*)?\"#\1?v=${GITHUB_SHA::7}\"#g"
          # ES module imports between our own scripts, so a changed module never comes from a stale cache
          # (and every page shares one instance of each module).
          sed -i -E "s#(['\"])(\./[a-z-]+\.js|/assets/backend/[a-z-]+\.js)(\?v=[^'\"]*)?(['\"])#\1\2?v=${GITHUB_SHA::7}\4#g" assets/backend/*.js main.js aktieriem/index.html admin/index.html

      - name: Load deploy key
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_HOST: ${{ secrets.SG_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 18765 "$SG_HOST" >> ~/.ssh/known_hosts

      # Only the site's own files. No --delete: the old WordPress install still lives in public_html.
      - name: Upload
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
        run: |
          rsync -rvz --checksum --exclude '_template.html' -e "ssh -p 18765 -i $HOME/.ssh/deploy_key -o BatchMode=yes" \
            index.html styles.css main.js favicon.ico robots.txt sitemap.xml googlec3673720e3b0e240.html assets blogs aktieriem admin \
            "$SG_USER@$SG_HOST:www/impromotion.lv/public_html/"

      # The same flush the Site Tools "Flush Cache" button does.
      - name: Flush SiteGround cache
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
        run: ssh -p 18765 -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "$SG_USER@$SG_HOST" 'site-tools-client domain-all update id=1 flush_cache=1'
